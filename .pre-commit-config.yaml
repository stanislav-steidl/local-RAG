default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      # Guard against private corpus data or model weights being committed.
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # The hook runs in an isolated environment, so every import mypy needs
        # to resolve must be declared here. The package itself is found via
        # `mypy_path = "src"` in pyproject.toml rather than being installed.
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.3
          - pytest>=8.2
          - typer>=0.12
          - rich>=13.7
        args: ["--config-file=pyproject.toml"]
        pass_filenames: false
