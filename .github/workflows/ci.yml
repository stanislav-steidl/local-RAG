name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Black
        run: black --check --diff .

      - name: Mypy
        run: mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[parsing,store,dev]"

      - name: Test
        run: pytest --cov --cov-report=term-missing -m "not slow"

  # Single stable check for branch protection to require. Depending on the
  # matrix jobs by name would break every time the matrix changes, and a
  # renamed job would silently stop being required.
  ci-success:
    name: CI success
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      # A job result is one of success, failure, cancelled or skipped. Only the
      # first is acceptable: a skipped job has not proven anything, so treating
      # it as success would let the gate pass vacuously if an upstream job ever
      # gained an `if:` condition or its matrix produced no combinations.
      - name: Verify every upstream job succeeded
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo "Upstream job results: ${{ join(needs.*.result, ', ') }}"
          echo "A required job did not succeed."
          exit 1
